# Builds and tests every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: xcode-27  # macOS with Xcode 27, matching local development
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test
        run: |
          xcodegen --quiet
          xcodebuild -project Notch.xcodeproj -scheme Notch -derivedDataPath build/test test \
            | grep -E "error:|✘|Test run|\*\* TEST"
